---
spring:
  datasource:
    url: "jdbc:h2:mem:e2e-db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: "org.h2.Driver"
    username: "sa"
    password: ""
  jpa:
    hibernate:
      ddl-auto: "validate"
    database-platform: "org.hibernate.dialect.H2Dialect"
  liquibase:
    change-log: "classpath:db/changelog/db.changelog-master.yaml"
  kafka:
    producer:
      acks: "all"
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        linger.ms: 5
keycloak:
  sync:
    enabled: false
    webhook-enabled: true
    webhook-secret: "e2e-webhook-secret"
    webhook-secret-header: "X-Keycloak-Webhook-Secret"
  token-client:
    server-url: "http://localhost:8080"
    realm: "authentis-user"
    client-id: "authentis-users"
    client-secret: "test-client-secret"
    reset-token-required-scope: "password:reset"
    read-timeout-seconds: 5
kapita:
  kafka:
    outbox:
      poll-interval-ms: 300
      batch-size: 20
      max-retries: 3
      retry-backoff-ms: 300
      topic-mappings:
        USER_CREATED: "authentis.user.created"
        USER_UPDATED: "authentis.user.updated"
        USER_DEACTIVATED: "authentis.user.deactivated"
