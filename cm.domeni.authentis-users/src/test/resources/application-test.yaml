---
spring:
  application:
    name: "authentis-users"
  jpa:
    hibernate:
      ddl-auto: "update"
    show-sql: true
    database-platform: "org.hibernate.dialect.PostgreSQLDialect"
  datasource:
    url: "jdbc:tc:postgresql:16-alpine:///test"
    driver-class-name: "org.testcontainers.jdbc.ContainerDatabaseDriver"
keycloak:
  admin-client:
    server-url: "http://localhost:8080/realms/"
    realm: "authentis-user"
    client-id: "authentis-user"
    client-secret: "authentis-users-password"
server:
  port: 8089
