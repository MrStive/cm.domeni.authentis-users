---
spring:
  application:
    name: "authentis-users"
  jpa:
    hibernate:
      ddl-auto: "validate"
    show-sql: true
    database-platform: "org.hibernate.dialect.PostgreSQLDialect"
  datasource:
    url: "jdbc:tc:postgresql:16-alpine:///test"
    driver-class-name: "org.testcontainers.jdbc.ContainerDatabaseDriver"
keycloak:
  admin-client:
    server-url: "http://localhost:8080/realms/"
    realm: "authentis-user"
    client-id: "authentis-user"
    client-secret: "change-me"
  token-client:
    server-url: "http://localhost:8080"
    realm: "authentis-user"
    client-id: "authentis-users"
    client-secret: "change-me"
    reset-token-required-scope: "password:reset"
    read-timeout-seconds: 5
server:
  port: 8089
