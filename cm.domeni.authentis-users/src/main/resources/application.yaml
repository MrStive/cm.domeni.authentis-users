---
server:
  port: 8089
spring:
  application:
    name: "authentis-users"
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authentis-users-db}"
    username: "${DB_USER:authentis-users}"
    password: "${DB_PASSWORD:change-me}"
  jpa:
    show-sql: true
    generate-ddl: false
    properties:
      eclipselink.weaving: "false"
      eclipselink.ddl-generation: "none"
      eclipselink.target-database: "PostgreSQL"
      eclipselink.logging.level: "WARNING"
      eclipselink.logging.level.sql: "FINE"
  liquibase:
    change-log: "classpath:db/changelog/db.changelog-master.yaml"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${ISSUER_URI:http://localhost:8080/realms/authentis-user}"
          jwk-set-uri: "${JWK_SET_URI:http://localhost:8080/realms/authentis-user/protocol/openid-connect/certs}"
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    producer:
      key-serializer: "org.apache.kafka.common.serialization.StringSerializer"
      value-serializer: "org.apache.kafka.common.serialization.StringSerializer"
      acks: "all"
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        linger.ms: 5
logging:
  level:
    org.springframework.security: "INFO"
    org.springframework.web: "INFO"
keycloak:
  admin-client:
    server-url: "${KEYCLOAK_SERVER_URL:http://localhost:8080}"
    realm: "${KEYCLOAK_REALM:authentis-user}"
    client-id: "${KEYCLOAK_ADMIN_CLIENT_ID:authentis-users}"
    client-secret: "${KEYCLOAK_ADMIN_CLIENT_SECRET:change-me}"
  token-client:
    server-url: "${KEYCLOAK_SERVER_URL:http://localhost:8080}"
    realm: "${KEYCLOAK_REALM:authentis-user}"
    client-id: "${KEYCLOAK_TOKEN_CLIENT_ID:authentis-users}"
    client-secret: "${KEYCLOAK_TOKEN_CLIENT_SECRET:change-me}"
    reset-token-required-scope: "${KEYCLOAK_RESET_TOKEN_REQUIRED_SCOPE:password:reset}"
    read-timeout-seconds: 10
  sync:
    enabled: "${KEYCLOAK_SYNC_ENABLED:true}"
    cron: "${KEYCLOAK_SYNC_CRON:0 */5 * * * *}"
    page-size: "${KEYCLOAK_SYNC_PAGE_SIZE:100}"
    webhook-enabled: "${KEYCLOAK_SYNC_WEBHOOK_ENABLED:false}"
    webhook-secret: "${KEYCLOAK_SYNC_WEBHOOK_SECRET:}"
    webhook-secret-header: "${KEYCLOAK_SYNC_WEBHOOK_SECRET_HEADER:X-Keycloak-Webhook-Secret}"
kapita:
  kafka:
    outbox:
      enabled: "${OUTBOX_ENABLED:true}"
      poll-interval-ms: "${OUTBOX_POLL_INTERVAL_MS:5000}"
      batch-size: "${OUTBOX_BATCH_SIZE:50}"
      max-retries: "${OUTBOX_MAX_RETRIES:10}"
      retry-backoff-ms: "${OUTBOX_RETRY_BACKOFF_MS:5000}"
      max-error-length: "${OUTBOX_MAX_ERROR_LENGTH:2000}"
      topic-mappings:
        USER_CREATED: "${USER_CREATED_KAFKA_TOPIC:authentis.user.created}"
        USER_UPDATED: "${USER_UPDATED_KAFKA_TOPIC:authentis.user.updated}"
        USER_DEACTIVATED: "${USER_DEACTIVATED_KAFKA_TOPIC:authentis.user.deactivated}"
