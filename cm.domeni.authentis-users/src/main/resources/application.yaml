---
spring:
  application:
    name: "authentis-users"
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authentis-users-db}"
    username: "${DB_USER:domeni.ngameni}"
    password: "${DB_PASSWORD:authentis-users-password}"
  jpa:
    hibernate:
      ddl-auto: "update"
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${ISSUER-URI:http://localhost:8280/realms/flash-home2}"
          jwk-set-uri: "${jwtk-set-uri:http://localhost:8280/realms/flash-home2/protocol/openid-connect/certs}"
logging:
  level:
    org.springframework.security: "INFO"
application:
  http-clients:
    keycloak-admin:
      base-url: "${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8280/admin/realms/flash-home2}"
      auth:
        token-uri: "${KEYCLOAK_TOKEN_URI:http://localhost:8280/realms/flash-home2/protocol/openid-connect/token}"
        client-id: "${KEYCLOAK_ADMIN_CLIENT_ID:flash-home2}"
        client-secret: "${KEYCLOAK_ADMIN_CLIENT_SECRET:iha3FXUz0utfmhGhQrnDZSwY5OtuaFUJ}"
        grant-type: "client_credentials"
