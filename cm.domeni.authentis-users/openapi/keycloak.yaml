openapi: 3.0.3
info:
  title: Keycloak Admin REST API
  description: Complete OpenAPI specification for Keycloak Admin REST API based on official documentation
  version: 20.0.0
  license:
    name: Apache License, Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8080/admin/realms/cm.domeni.authentis-users
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Role Schemas (from previous specification)
    RoleRepresentation:
      type: object
      properties:
        id:
          type: string
          description: Role ID
        name:
          type: string
          description: Role name
        description:
          type: string
          description: Role description
        composite:
          type: boolean
          description: Indicates if the role is composite
        composites:
          $ref: '#/components/schemas/RoleRepresentation-Composites'
        clientRole:
          type: boolean
          description: Indicates if the role is a client role
        containerId:
          type: string
          description: Container ID (client or realm)
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Role attributes
      required:
        - name

    RoleRepresentation-Composites:
      type: object
      properties:
        realm:
          type: array
          items:
            type: string
          description: Realm role composites
        client:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Client role composites

    # User Representation
    UserRepresentation:
      type: object
      properties:
        id:
          type: string
          description: User ID
        username:
          type: string
          description: Username
        email:
          type: string
          description: Email address
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        enabled:
          type: boolean
          description: Whether the user is enabled
        emailVerified:
          type: boolean
          description: Whether email is verified
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: User attributes
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/CredentialRepresentation'
        requiredActions:
          type: array
          items:
            type: string
          description: Required actions

    # Credential Representation
    CredentialRepresentation:
      type: object
      properties:
        type:
          type: string
          description: Credential type
        value:
          type: string
          description: Credential value
        temporary:
          type: boolean
          description: Whether credential is temporary

    # Client Representation
    ClientRepresentation:
      type: object
      properties:
        id:
          type: string
          description: Client ID
        clientId:
          type: string
          description: Client identifier
        name:
          type: string
          description: Client name
        description:
          type: string
          description: Client description
        enabled:
          type: boolean
          description: Whether client is enabled
        secret:
          type: string
          description: Client secret
        redirectUris:
          type: array
          items:
            type: string
          description: Redirect URIs
        webOrigins:
          type: array
          items:
            type: string
          description: Web origins

    # Group Representation
    GroupRepresentation:
      type: object
      properties:
        id:
          type: string
          description: Group ID
        name:
          type: string
          description: Group name
        path:
          type: string
          description: Group path
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Group attributes
        subGroups:
          type: array
          items:
            $ref: '#/components/schemas/GroupRepresentation'
          description: Subgroups

    # Authentication Execution Representation
    AuthenticationExecutionRepresentation:
      type: object
      properties:
        id:
          type: string
          description: Execution ID
        authenticator:
          type: string
          description: Authenticator
        requirement:
          type: string
          description: Requirement
        priority:
          type: integer
          description: Priority
        authenticatorConfig:
          type: string
          description: Authenticator config ID
        autheticatorFlow:
          type: boolean
          description: Whether it's an authenticator flow

    # Authenticator Config Representation
    AuthenticatorConfigRepresentation:
      type: object
      properties:
        id:
          type: string
          description: Config ID
        alias:
          type: string
          description: Alias
        config:
          type: object
          additionalProperties:
            type: string
          description: Configuration values
    TokenResponse:
      type: "object"
      properties:
        access_token:
          type: "string"
        expires_in:
          type: "integer"
        refresh_expires_in:
          type: "integer"
        token_type:
          type: string
        not_before_policy:
          type: "integer"
        scope:
          type: "string"
security:
  - bearerAuth: []

paths:
  # ========== ROLES ENDPOINTS ==========

  /protocol/openid-connect/token:
    post:
      tags:
        - "KeycloakAuth"
      summary: "Get Access Token using client credentials"
      operationId: "getToken"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: "object"
              properties:
                grant_type:
                  type: "string"
                  example: "client_credentials"
                client_id:
                  type: "string"
                client_secret:
                  type: "string"
              required:
                - "grant_type"
                - "client_id"
                - "client_secret"
      responses:
        '200':
          description: "Token response"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /roles:
    get:
      tags:
        - Roles
      summary: Get all roles for the realm
      description: Returns a list of all realm roles :cite[1]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleRepresentation'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: getRealmRoles

    post:
      tags:
        - Roles
      summary: Create a new role for the realm
      description: Creates a new realm role :cite[1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRepresentation'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict - Role already exists
        '500':
          description: Internal Server Error
      operationId: createRealmRole

  /roles/{role-name}:
    get:
      tags:
        - Roles
      summary: Get a specific role by name
      description: Returns a role representation by its name :cite[1]
      parameters:
        - name: role-name
          in: path
          required: true
          schema:
            type: string
          description: Role name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRepresentation'
        '404':
          description: Not Found - Role doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: getRealmRole

    put:
      tags:
        - Roles
      summary: Update a role
      description: Updates the role with the given name :cite[1]
      parameters:
        - name: role-name
          in: path
          required: true
          schema:
            type: string
          description: Role name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRepresentation'
      responses:
        '204':
          description: No Content - Successfully updated
        '400':
          description: Bad Request
        '404':
          description: Not Found - Role doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: updateRealmRole

    delete:
      tags:
        - Roles
      summary: Delete a role
      description: Deletes the role with the given name :cite[1]
      parameters:
        - name: role-name
          in: path
          required: true
          schema:
            type: string
          description: Role name
      responses:
        '204':
          description: No Content - Successfully deleted
        '404':
          description: Not Found - Role doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: deleteRealmRole

  /roles/{role-name}/composites:
    get:
      tags:
        - Role Composites
      summary: Get role composites
      description: Returns composites of the role :cite[1]
      parameters:
        - name: role-name
          in: path
          required: true
          schema:
            type: string
          description: Role name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleRepresentation'
        '404':
          description: Not Found - Role doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: getRoleComposites

    post:
      tags:
        - Role Composites
      summary: Add composites to the role
      description: Adds composites to the role :cite[1]
      parameters:
        - name: role-name
          in: path
          required: true
          schema:
            type: string
          description: Role name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RoleRepresentation'
      responses:
        '204':
          description: No Content - Successfully added composites
        '400':
          description: Bad Request
        '404':
          description: Not Found - Role doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: addRoleComposites

    delete:
      tags:
        - Role Composites
      summary: Remove composites from the role
      description: Removes composites from the role :cite[1]
      parameters:
        - name: role-name
          in: path
          required: true
          schema:
            type: string
          description: Role name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RoleRepresentation'
      responses:
        '204':
          description: No Content - Successfully removed composites
        '400':
          description: Bad Request
        '404':
          description: Not Found - Role doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: deleteRoleComposites

  # ========== USERS ENDPOINTS ==========
  /users:
    get:
      tags:
        - Users
      summary: Get users
      description: Returns a list of users, filtered according to query parameters :cite[1]
      operationId: getUsers
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Filter by username
        - name: email
          in: query
          required: false
          schema:
            type: string
          description: Filter by email
        - name: firstName
          in: query
          required: false
          schema:
            type: string
          description: Filter by first name
        - name: lastName
          in: query
          required: false
          schema:
            type: string
          description: Filter by last name
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search string
        - name: first
          in: query
          required: false
          schema:
            type: integer
          description: Pagination offset
        - name: max
          in: query
          required: false
          schema:
            type: integer
          description: Maximum results size
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRepresentation'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error

    post:
      tags:
        - Users
      summary: Create a new user
      description: Creates a new user :cite[1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRepresentation'
      operationId: createUser
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict - User already exists
        '500':
          description: Internal Server Error

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Returns the user representation :cite[1]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRepresentation'
        '404':
          description: Not Found - User doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: getUserById

    put:
      tags:
        - Users
      summary: Update a user
      description: Updates the user with the given ID :cite[1]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRepresentation'
      responses:
        '204':
          description: No Content - Successfully updated
        '400':
          description: Bad Request
        '404':
          description: Not Found - User doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: updateUser

    delete:
      tags:
        - Users
      summary: Delete a user
      description: Deletes the user with the given ID :cite[1]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '204':
          description: No Content - Successfully deleted
        '404':
          description: Not Found - User doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: deleteUser

  # ========== CLIENT ENDPOINTS ==========
  /clients:
    get:
      tags:
        - Clients
      summary: Get clients
      description: Returns a list of clients :cite[1]
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: string
          description: Filter by clientId
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search string
        - name: first
          in: query
          required: false
          schema:
            type: integer
          description: Pagination offset
        - name: max
          in: query
          required: false
          schema:
            type: integer
          description: Maximum results size
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientRepresentation'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: getClients

    post:
      tags:
        - Clients
      summary: Create a new client
      description: Creates a new client :cite[1]
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRepresentation'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict - Client already exists
        '500':
          description: Internal Server Error

  /clients/{id}:
    get:
      tags:
        - Clients
      summary: Get client by ID
      description: Returns the client representation :cite[1]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Client ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRepresentation'
        '404':
          description: Not Found - Client doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: getClientById

    put:
      tags:
        - Clients
      summary: Update a client
      description: Updates the client with the given ID :cite[1]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Client ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRepresentation'
      responses:
        '204':
          description: No Content - Successfully updated
        '400':
          description: Bad Request
        '404':
          description: Not Found - Client doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: updateClient

    delete:
      tags:
        - Clients
      summary: Delete a client
      description: Deletes the client with the given ID :cite[1]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Client ID
      responses:
        '204':
          description: No Content - Successfully deleted
        '404':
          description: Not Found - Client doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: deleteClient

  # ========== GROUPS ENDPOINTS ==========
  /groups:
    get:
      tags:
        - Groups
      summary: Get groups
      description: Returns a list of groups :cite[1]
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search string
        - name: first
          in: query
          required: false
          schema:
            type: integer
          description: Pagination offset
        - name: max
          in: query
          required: false
          schema:
            type: integer
          description: Maximum results size
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupRepresentation'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: getGroups

    post:
      tags:
        - Groups
      summary: Create a new group
      description: Creates a new group :cite[1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRepresentation'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict - Group already exists
        '500':
          description: Internal Server Error
      operationId: createGroup

  /groups/{id}:
    get:
      tags:
        - Groups
      summary: Get group by ID
      description: Returns the group representation :cite[1]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Group ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRepresentation'
        '404':
          description: Not Found - Group doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: getGroupById

    put:
      tags:
        - Groups
      summary: Update a group
      description: Updates the group with the given ID :cite[1]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Group ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRepresentation'
      responses:
        '204':
          description: No Content - Successfully updated
        '400':
          description: Bad Request
        '404':
          description: Not Found - Group doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: updateGroup

    delete:
      tags:
        - Groups
      summary: Delete a group
      description: Deletes the group with the given ID :cite[1]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Group ID
      responses:
        '204':
          description: No Content - Successfully deleted
        '404':
          description: Not Found - Group doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: deleteGroup

  # ========== AUTHENTICATION ENDPOINTS ==========
  /authentication/authenticator-providers:
    get:
      tags:
        - Authentication
      summary: Get authenticator providers
      description: Returns a stream of authenticator providers :cite[1]
      operationId: getAuthenticatorProviders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error

  /authentication/config/{id}:
    get:
      tags:
        - Authentication
      summary: Get authenticator configuration
      description: Get authenticator configuration :cite[1]
      operationId: getAuthenticatorConfig
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Configuration ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatorConfigRepresentation'
        '404':
          description: Not Found - Configuration doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error

    put:
      tags:
        - Authentication
      summary: Update authenticator configuration
      description: Update authenticator configuration :cite[1]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Configuration ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatorConfigRepresentation'
      responses:
        '204':
          description: No Content - Successfully updated
        '400':
          description: Bad Request
        '404':
          description: Not Found - Configuration doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: updateAuthenticatorConfig

    delete:
      tags:
        - Authentication
      summary: Delete authenticator configuration
      description: Delete authenticator configuration :cite[1]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Configuration ID
      responses:
        '204':
          description: No Content - Successfully deleted
        '404':
          description: Not Found - Configuration doesn't exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: deleteAuthenticatorConfig

  /authentication/config:
    post:
      tags:
        - Authentication
      summary: Create authenticator configuration
      description: Create new authenticator configuration :cite[1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatorConfigRepresentation'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: createAuthenticatorConfig

  # ========== ATTACK DETECTION ENDPOINTS ==========
  /attack-detection/brute-force/users:
    delete:
      tags:
        - Attack Detection
      summary: Clear login failures for all users
      description: Clear any user login failures for all users :cite[1]
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: clearAllLoginFailures

  /attack-detection/brute-force/users/{userId}:
    delete:
      tags:
