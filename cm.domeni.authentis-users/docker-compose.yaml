services:
  postgres_authenthis_users:
    image: postgres:17
    container_name: authentis-postgres_authenthis_users-db
    environment:
      POSTGRES_DB: authentis-users-db
      POSTGRES_USER: ${POSTGRES_AUTHENTIS_USER:-authentis-users}
      POSTGRES_PASSWORD: ${POSTGRES_AUTHENTIS_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_authenthis_users:/var/lib/postgresql/data
    networks:
      microservices_network:
        aliases:
          - postgres_authenthis_users
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTHENTIS_USER:-authentis-users} -d authentis-users-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_keycloak:
    image: postgres:17
    container_name: postgres_keycloak
    environment:
      POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD:-change-me}
      POSTGRES_DB: keycloak_db
    ports:
      - "5437:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      microservices_network:
        aliases:
          - postgres_keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_KEYCLOAK_USER:-keycloak} -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_image:
    image: postgres:17
    container_name: authetis_user_postgres_image
    environment:
      POSTGRES_USER: ${POSTGRES_IMAGE_USER:-authentis-users}
      POSTGRES_PASSWORD: ${POSTGRES_IMAGE_PASSWORD:-change-me}
      POSTGRES_DB: authentis-users-db
    ports:
      - "5436:5432"
    volumes:
      - postgres_image_data:/var/lib/postgresql/data
    networks:
      microservices_network:
        aliases:
          - postgres_image
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_IMAGE_USER:-authentis-users} -d authentis-users-db"]
      interval: 30s
      timeout: 10s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: authentis-users-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_keycloak:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD:-change-me}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_ENV: production
      KC_HOSTNAME_STRICT: "false"
      LOG_LEVEL: DEBUG
    ports:
      - "8080:8080"
    depends_on:
      postgres_keycloak:
        condition: service_healthy
    networks:
      - microservices_network
    command: start

  authentis-users:
    image: eclipse-temurin:25-jre
    container_name: authentis-users-app
    working_dir: /workspace
    environment:
      DB_HOST: postgres_authenthis_users
      DB_PORT: 5432
      DB_NAME: authentis-users-db
      DB_USER: ${POSTGRES_AUTHENTIS_USER:-authentis-users}
      DB_PASSWORD: ${POSTGRES_AUTHENTIS_PASSWORD:-change-me}
      ISSUER_URI: ${ISSUER_URI:-http://keycloak:8080/realms/authentis-user}
      JWK_SET_URI: ${JWK_SET_URI:-http://keycloak:8080/realms/authentis-user/protocol/openid-connect/certs}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-authentis-user}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
    volumes:
      - ./:/workspace
    depends_on:
      postgres_authenthis_users:
        condition: service_healthy
      keycloak:
        condition: service_started
    command:
      [
        "sh",
        "-lc",
        "JAR_PATH=$$(ls -1 build/libs/*.jar 2>/dev/null | head -n1); if [ -z \"$$JAR_PATH\" ]; then echo \"No jar found in build/libs. Run ./gradlew bootJar first.\"; exit 1; fi; exec java --enable-preview -XX:TieredStopAtLevel=1 -Dspring.output.ansi.enabled=always -Dfile.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8 -jar \"$$JAR_PATH\"",
      ]
    ports:
      - "8089:8089"
    networks:
      - microservices_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-domeni.ngameni@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - microservices_network
    restart: unless-stopped
    depends_on:
      - postgres_authenthis_users
      - postgres_image
      - postgres_keycloak
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/misc/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_authenthis_users:
    driver: local
  postgres_keycloak_data:
    driver: local
  pgadmin_data:
    driver: local
  postgres_image_data:
    driver: local

networks:
  microservices_network:
    driver: bridge
